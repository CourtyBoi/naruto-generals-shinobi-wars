; -----------------------------------------------------------------------------
; SUNA BUILDER (Sand Sculptor & Puppet Craftsman)
; -----------------------------------------------------------------------------
Object SunaPuppetBuilder
  SelectPortrait         = SNSunaBuilder_L
  ButtonImage            = SNSunaBuilder
  Side                   = FactionSuna
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = UIRBL_SKL.UIRBL_STA
      IdleAnimation     = UIRBL_SKL.UIRBL_STA 0 30
      AnimationMode     = ONCE
    End

    ConditionState      = MOVING
      Animation         = UIRBL_SKL.UIRBL_RNA 20
      AnimationMode     = LOOP
    End

    ConditionState      = DYING
      Animation         = UIRBL_SKL.UIRBL_DTA
      AnimationMode     = ONCE
    End
  End

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
  End

  VisionRange            = 150
  ShroudClearingRange    = 250
  BuildCost              = 1000
  BuildTime              = 5.0

  CommandSet             = SunaBuilderCommandSet

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 170.0
    InitialHealth   = 170.0
  End

  Behavior = DozerAIUpdate ModuleTag_03
    RepairHealthPercentPerSecond = 2%
    BoredTime                    = 3000
    BoredRange                   = 150
  End

  Locomotor = SET_NORMAL NinjaLocomotor
  CrushableLevel = 0
End

