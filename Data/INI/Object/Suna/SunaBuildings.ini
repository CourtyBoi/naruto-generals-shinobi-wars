; -----------------------------------------------------------------------------
; GOLD DUST SIFTING EXTRACTOR (Secondary Economy - Passive Ryo Production)
; -----------------------------------------------------------------------------
Object SunaGoldDustExtractor
  SelectPortrait         = SNSunaGold_L
  ButtonImage            = SNSunaGold
  Side                   = FactionSuna
  EditorSorting          = STRUCTURE

  ArmorSet
    Conditions           = None
    Armor                = ShinobiStructureArmor
  End

  VisionRange            = 150.0
  ShroudClearingRange    = 200.0
  BuildCost              = 2500
  BuildTime              = 25.0
  EnergyProduction       = -3

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 1200.0
    InitialHealth   = 1200.0
  End

  Behavior = AutoDepositUpdate ModuleTag_02
    DepositInterval = 3000   ; 3 seconds
    DepositAmount   = 35     ; Grants 35 Ryo per tick (similar to GLA Black Market / China Hacker)
  End
End

