; -----------------------------------------------------------------------------
; COMMAND & CONQUER GENERALS: SHINOBI WARS
; SunaHeroes.ini - Legendary Hero Unit: Gaara of the Sand
; -----------------------------------------------------------------------------

Object SunaHeroGaara
  SelectPortrait         = SNGaara_L
  ButtonImage            = SNGaara
  Side                   = FactionSuna
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1
  MaxSimultaneousOfType  = 1  ; Unique Legendary Hero

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = UIRBL_SKL.UIRBL_STA
      IdleAnimation     = UIRBL_SKL.UIRBL_STA 0 35
      AnimationMode     = ONCE
      ParticleSysBone   = GOURD SandGourdLeakFX
    End

    ConditionState      = MOVING
      Animation         = UIRBL_SKL.UIRBL_RNA 20
      AnimationMode     = LOOP
    End

    ConditionState      = FIRING_A
      Animation         = UIRBL_SKL.UIRBL_ATA
      AnimationMode     = ONCE
      ParticleSysBone   = HAND_R SandGripWaveFX
    End

    ConditionState      = SPECIAL_POWER_1 ; Sand Shield Sphere
      Animation         = UIRBL_SKL.UIRBL_STA
      ParticleSysBone   = NONE AbsoluteSandSphereFX
    End

    ConditionState      = DYING
      Animation         = UIRBL_SKL.UIRBL_DTA
      AnimationMode     = ONCE
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY   WindScytheBarrage
  End

  ArmorSet
    Conditions           = None
    Armor                = GiantBeastHideArmor  ; Sand Armor makes Gaara extremely durable
  End

  VisionRange            = 300
  ShroudClearingRange    = 450

  BuildCost              = 1800
  BuildTime              = 20.0
  ExperienceValue        = 200 300 450 600
  IsTrainable            = Yes

  CommandSet             = SunaGaaraCommandSet

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 950.0
    InitialHealth   = 950.0
  End

  ; --- PASSIVE: SAND SHIELD (ABSORBS DAMAGE) ---
  Behavior = AutoHealBehavior ModuleTag_03
    HealingAmount     = 8
    HealingDelay      = 800
    StartHealingDelay = 3000
  End

  ; --- ACTIVE JUTSU: THIRD EYE RECON ---
  Behavior = SpecialPowerCompletionDie ModuleTag_04
    SpecialPowerTemplate = SpecialPower_GaaraThirdEye
  End

  Behavior = AIUpdateInterface ModuleTag_05
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL HighSpeedNinjaLocomotor
  CrushableLevel = 2
End
