; -----------------------------------------------------------------------------
; COMMAND & CONQUER GENERALS: SHINOBI WARS
; AkatsukiHeroes.ini - Legendary Heroes: Pain (Deva Path) & Itachi Uchiha
; -----------------------------------------------------------------------------

Object AkatsukiHeroPain
  SelectPortrait         = SNPain_L
  ButtonImage            = SNPain
  Side                   = FactionAkatsuki
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1
  MaxSimultaneousOfType  = 1

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = UIRBL_SKL.UIRBL_STA
      IdleAnimation     = UIRBL_SKL.UIRBL_STA 0 35
      AnimationMode     = ONCE
    End

    ConditionState      = MOVING
      Animation         = UIRBL_SKL.UIRBL_RNA 25
      AnimationMode     = LOOP
    End

    ConditionState      = FIRING_A
      Animation         = UIRBL_SKL.UIRBL_ATA
      AnimationMode     = ONCE
      ParticleSysBone   = NONE BlueChakraSwirlFX
    End

    ConditionState      = SPECIAL_POWER_1 ; Shinra Tensei Repulsion
      Animation         = UIRBL_SKL.UIRBL_ATA
      ParticleSysBone   = NONE ShinobiDustCloudFX
    End

    ConditionState      = DYING
      Animation         = UIRBL_SKL.UIRBL_DTA
      AnimationMode     = ONCE
      ParticleSysBone   = NONE PoofWhiteSmokeFX
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY GentleFistTaijutsu
    Weapon               = SECONDARY ExplosiveTagWeapon
  End

  ArmorSet
    Conditions           = None
    Armor                = GiantBeastHideArmor  ; Rinnegan divine barrier
  End

  VisionRange            = 320
  ShroudClearingRange    = 480

  BuildCost              = 2000
  BuildTime              = 25.0
  ExperienceValue        = 250 350 500 700
  IsTrainable            = Yes

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1100.0
    InitialHealth   = 1100.0
  End

  ; --- PASSIVE: RINNEGAN SIX PATHS VISION ---
  Behavior = StealthDetectorUpdate ModuleTag_03
    DetectionRate     = 500
    DetectionRange    = 380
  End

  Behavior = AutoHealBehavior ModuleTag_04
    HealingAmount     = 8
    HealingDelay      = 800
    StartHealingDelay = 3000
  End

  Behavior = AIUpdateInterface ModuleTag_05
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL HighSpeedNinjaLocomotor
  CrushableLevel = 2
End

