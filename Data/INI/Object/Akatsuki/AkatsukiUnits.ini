; -----------------------------------------------------------------------------
; WHITE ZETSU WORKER (Expendable Bio-Clone Builder)
; -----------------------------------------------------------------------------
Object AkatsukiWhiteZetsuWorker
  SelectPortrait         = SNAkatsukiZetsu_L
  ButtonImage            = SNAkatsukiZetsu
  Side                   = FactionAkatsuki
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
  End

  VisionRange            = 150
  ShroudClearingRange    = 250
  BuildCost              = 800
  BuildTime              = 4.0

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 140.0
    InitialHealth   = 140.0
  End

  Behavior = DozerAIUpdate ModuleTag_02
    RepairHealthPercentPerSecond = 2%
    BoredTime                    = 3000
    BoredRange                   = 150
  End

  Locomotor = SET_NORMAL NinjaLocomotor
  CrushableLevel = 0
End

