; -----------------------------------------------------------------------------
; COMMAND & CONQUER GENERALS: SHINOBI WARS
; NeutralBuildings.ini - Neutral Map Objectives & Supply Depots
; -----------------------------------------------------------------------------

; -----------------------------------------------------------------------------
; DAIMYO MISSION OUTPOST (Supply Warehouse Equivalent)
; -----------------------------------------------------------------------------
Object DaimyoMissionOutpost
  SelectPortrait         = SNOutpost_L
  ButtonImage            = SNOutpost
  Side                   = Civilian
  EditorSorting          = STRUCTURE

  ArmorSet
    Conditions           = None
    Armor                = ShinobiStructureArmor
  End

  VisionRange            = 150.0
  ShroudClearingRange    = 200.0

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 5000.0
    InitialHealth   = 5000.0
  End

  Behavior = SupplyWarehouseCreate ModuleTag_02
  End

  Behavior = SupplyWarehouseDockUpdate ModuleTag_03
    NumberBoxes              = 200       ; Total supply points available (approx $30,000 Ryo)
    StartingBoxesPerPlayer   = 0
    WarehouseBoxDepositDelay = 200
  End
End

; -----------------------------------------------------------------------------
; TECH CHAKRA SPRING (Tech Oil Derrick Equivalent - Capturable Economy)
; -----------------------------------------------------------------------------
Object TechChakraSpring
  SelectPortrait         = SNSpring_L
  ButtonImage            = SNSpring
  Side                   = Civilian
  EditorSorting          = STRUCTURE

  ArmorSet
    Conditions           = None
    Armor                = ShinobiStructureArmor
  End

  VisionRange            = 150.0
  ShroudClearingRange    = 200.0

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 3000.0
    InitialHealth   = 3000.0
  End

  ; Capturable by infantry
  Behavior = TechBuildingBehavior ModuleTag_02
  End

  ; Grants continuous passive Ryo
  Behavior = AutoDepositUpdate ModuleTag_03
    DepositInterval = 4000 ; 4 seconds
    DepositAmount   = 20   ; 20 Ryo per tick
    InitialCaptureBonus = 1000 ; 1,000 Ryo bonus upon capture!
  End
End
