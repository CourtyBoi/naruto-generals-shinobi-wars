; -----------------------------------------------------------------------------
; HOKAGE RESIDENCE & ADMINISTRATIVE OFFICE (Command Center)
; -----------------------------------------------------------------------------
Object KonohaHokageOffice
  SelectPortrait         = SNKonohaOffice_L
  ButtonImage            = SNKonohaOffice
  Side                   = FactionKonoha
  EditorSorting          = STRUCTURE
  TransportSlotCount     = 0

  ArmorSet
    Conditions           = None
    Armor                = ShinobiStructureArmor
    DamageFX             = None
  End

  VisionRange            = 300.0
  ShroudClearingRange    = 400.0

  BuildCost              = 2000
  BuildTime              = 15.0
  EnergyProduction       = 0
  CommandSet             = KonohaCommandCenterCommandSet

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 4000.0
    InitialHealth   = 4000.0
  End

  Behavior = CommandCenterInterface ModuleTag_02
  End

  Behavior = GenerateMinefieldBehavior ModuleTag_03
    MineName             = KonohaExplosiveTagTrap
    DistanceAroundObject = 35
  End
End

