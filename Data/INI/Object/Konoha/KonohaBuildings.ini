; -----------------------------------------------------------------------------
; SHINOBI ACADEMY (Barracks Equivalent)
; -----------------------------------------------------------------------------
Object KonohaNinjaAcademy
  SelectPortrait         = SNKonohaAcademy_L
  ButtonImage            = SNKonohaAcademy
  Side                   = FactionKonoha
  EditorSorting          = STRUCTURE

  ArmorSet
    Conditions           = None
    Armor                = ShinobiStructureArmor
    DamageFX             = None
  End

  VisionRange            = 200.0
  ShroudClearingRange    = 250.0

  BuildCost              = 500
  BuildTime              = 7.0
  EnergyProduction       = -2   ; Consumes 2 chakra
  CommandSet             = KonohaAcademyCommandSet

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 1500.0
    InitialHealth   = 1500.0
  End

  Behavior = ProductionUpdate ModuleTag_02
    NumDoorAnimations            = 1
    DoorOpeningTime              = 1000
    DoorWaitOpenTime             = 1000
    DoorCloseTime                = 1000
    ConstructionCompleteDuration = 200
  End

  Behavior = DefaultProductionExitUpdate ModuleTag_03
