; -----------------------------------------------------------------------------
; KONOHA BUILDER (Doton / Woodcraft Constructor)
; -----------------------------------------------------------------------------
Object KonohaGeninBuilder
  SelectPortrait         = SNKonohaBuilder_L
  ButtonImage            = SNKonohaBuilder
  Side                   = FactionKonoha
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = AIRNGR_SKL.AIRNGR_STA
      IdleAnimation     = AIRNGR_SKL.AIRNGR_STA 0 35
      AnimationMode     = ONCE
      HideSubObject     = LASER
    End

    ConditionState      = MOVING
      Animation         = AIRNGR_SKL.AIRNGR_RNA 20
      AnimationMode     = LOOP
    End

    ConditionState      = PREATTACK_A
      Animation         = AIRNGR_SKL.AIRNGR_ATA
      AnimationMode     = ONCE
    End

    ConditionState      = DYING
      Animation         = AIRNGR_SKL.AIRNGR_DTA
      AnimationMode     = ONCE
    End
  End

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
    DamageFX             = None
  End

  VisionRange            = 150
  ShroudClearingRange    = 250

  BuildCost              = 1000
  BuildTime              = 5.0
  ExperienceValue        = 20 20 40 60
  MaxSimultaneousOfType  = 0

  CommandSet             = KonohaBuilderCommandSet

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 180.0
    InitialHealth   = 180.0
  End

  Behavior = DozerAIUpdate ModuleTag_03
    RepairHealthPercentPerSecond = 2%
    BoredTime                    = 3000
    BoredRange                   = 150
  End

  Locomotor = SET_NORMAL NinjaLocomotor
  CrushableLevel = 0  ; Can be crushed by heavy summons / boulders
End

; -----------------------------------------------------------------------------
; KONOHA COURIER NINJA (Mission Bounty Collector / Supply Gatherer)
; -----------------------------------------------------------------------------
Object KonohaCourierNinja
  SelectPortrait         = SNKonohaCourier_L
  ButtonImage            = SNKonohaCourier
  Side                   = FactionKonoha
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = UIRBL_SKL.UIRBL_STA
      IdleAnimation     = UIRBL_SKL.UIRBL_STA 0 30
      AnimationMode     = ONCE
    End

    ConditionState      = MOVING
      Animation         = UIRBL_SKL.UIRBL_RNA 25
      AnimationMode     = LOOP
    End

    ConditionState      = DYING
      Animation         = UIRBL_SKL.UIRBL_DTA
      AnimationMode     = ONCE
    End
  End

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
    DamageFX             = None
  End

  VisionRange            = 120
  ShroudClearingRange    = 200

  BuildCost              = 600
  BuildTime              = 7.0

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 220.0
    InitialHealth   = 220.0
  End

  Behavior = SupplyTruckAIUpdate ModuleTag_03
    MaxBoxes                = 4
    SupplyCenterActionDelay = 200     ; Milliseconds
    SupplyWarehouseActionDelay = 600  ; Milliseconds
    SupplyWarehouseScanDistance = 700 ; Distance to search for supply depots
    DepletedAnnounceDistance = 600
  End

  Locomotor = SET_NORMAL HighSpeedNinjaLocomotor
  CrushableLevel = 0
End

