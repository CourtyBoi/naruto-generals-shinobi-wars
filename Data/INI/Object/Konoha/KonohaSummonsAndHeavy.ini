  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = AVRAPTOR_SKN  ; Aerial striker proxy
    End

    ConditionState      = FLYING
      Model             = AVRAPTOR_SKN
      ParticleSysBone   = NONE InkFeatherTrailFX
    End

    ConditionState      = DYING
      Model             = AVRAPTOR_SKN
      ParticleSysBone   = NONE BlackInkExplosionFX
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY ExplosiveTagWeapon
  End

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
