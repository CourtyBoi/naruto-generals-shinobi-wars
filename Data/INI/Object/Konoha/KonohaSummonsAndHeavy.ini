  End

  VisionRange            = 300
  ShroudClearingRange    = 450

  BuildCost              = 1100
  BuildTime              = 12.0

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 320.0
    InitialHealth   = 320.0
  End

  Behavior = JetAIUpdate ModuleTag_03
    AutoAcquireEnemiesWhenIdle = No
