; -----------------------------------------------------------------------------
; AKIMICHI CLAN HUMAN BOULDER (Medium Battle Tank Equivalent)
; -----------------------------------------------------------------------------
Object KonohaAkimichiBruiser
  SelectPortrait         = SNKonohaAkimichi_L
  ButtonImage            = SNKonohaAkimichi
  Side                   = FactionKonoha
  EditorSorting          = VEHICLE
  TransportSlotCount     = 3

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = UVTRUCK_SKN  ; Fallback heavy chassis / boulder
      Animation         = UVTRUCK_SKL.UVTRUCK_MOV
      AnimationMode     = LOOP
    End

    ConditionState      = REALLYDAMAGED
      Model             = UVTRUCK_SKN
      ParticleSysBone   = NONE ShinobiDustCloudFX
    End

    ConditionState      = DYING
      Model             = UVTRUCK_SKN
      ParticleSysBone   = NONE PoofWhiteSmokeFX
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY AkimichiHumanBoulderWeapon
  End

  ArmorSet
    Conditions           = None
    Armor                = AkimichiBoulderArmor
    DamageFX             = None
  End

  VisionRange            = 180
  ShroudClearingRange    = 300

  BuildCost              = 850
  BuildTime              = 10.0
  ExperienceValue        = 60 80 120 160

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 650.0
    InitialHealth   = 650.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL HeavyRollingLocomotor
  CrusherLevel   = 2  ; Crushes regular infantry beneath rolling expansion!
  CrushableLevel = 2  ; Cannot be crushed by normal units
End

; -----------------------------------------------------------------------------
; GIANT BATTLE TOAD - KUCHIYOSE (Heavy Battle Tank / Paladin Equivalent)
; -----------------------------------------------------------------------------
Object KonohaGiantBattleToad
  SelectPortrait         = SNKonohaToad_L
  ButtonImage            = SNKonohaToad
  Side                   = FactionKonoha
  EditorSorting          = VEHICLE
  TransportSlotCount     = 5

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = NVOVRLRD_SKN  ; Overlord base scale proxy
      Turret            = TURRET
      WeaponFireFXBone  = PRIMARY TURRET
      WeaponLaunchBone  = PRIMARY TURRET
    End

    ConditionState      = FIRING_A
      Model             = NVOVRLRD_SKN
      ParticleSysBone   = TURRET WaterSplashBlastFX
    End

    ConditionState      = DYING
      Model             = NVOVRLRD_SKN
      ParticleSysBone   = NONE GiantSummonDisperseFX
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY   GiantToadWaterBulletCannon
    Weapon               = SECONDARY GiantToadCleaveBlade
    AutoChooseWeaponInsidePhysicallyDisabled = Yes
  End

  ArmorSet
    Conditions           = None
    Armor                = GiantBeastHideArmor
    DamageFX             = None
  End

  VisionRange            = 220
  ShroudClearingRange    = 350

  BuildCost              = 1400
  BuildTime              = 18.0
  ExperienceValue        = 120 160 220 300

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1200.0
    InitialHealth   = 1200.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL GiantBeastLeapLocomotor
  CrusherLevel   = 3  ; Crushes infantry and light puppet platforms
  CrushableLevel = 3  ; Immune to crushing
End

; -----------------------------------------------------------------------------
; CHŌJŪ GIGA INK BIRD SQUAD (Combat Aircraft / Strike Bomber Equivalent)
