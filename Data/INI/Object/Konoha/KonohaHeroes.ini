; -----------------------------------------------------------------------------
; COMMAND & CONQUER GENERALS: SHINOBI WARS
; KonohaHeroes.ini - Legendary Hero Unit: Hatake Kakashi
; -----------------------------------------------------------------------------

Object KonohaHeroKakashi
  SelectPortrait         = SNKakashi_L
  ButtonImage            = SNKakashi
  Side                   = FactionKonoha
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1
  MaxSimultaneousOfType  = 1  ; Unique Legendary Hero

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model             = AIRNGR_SKL.AIRNGR_STA
      IdleAnimation     = AIRNGR_SKL.AIRNGR_STA 0 35
      AnimationMode     = ONCE
    End

    ConditionState      = MOVING
      Animation         = AIRNGR_SKL.AIRNGR_RNA 25
      AnimationMode     = LOOP
    End

    ConditionState      = FIRING_A
      Animation         = AIRNGR_SKL.AIRNGR_ATA
      AnimationMode     = ONCE
      ParticleSysBone   = HAND_R RaikiriLightningAuraFX
    End

    ConditionState      = SPECIAL_POWER_1 ; Kamui Dimensional Warp
      Animation         = AIRNGR_SKL.AIRNGR_ATA
      ParticleSysBone   = EYE_L KamuiDimensionalVortexFX
    End

    ConditionState      = DYING
      Animation         = AIRNGR_SKL.AIRNGR_DTA
      AnimationMode     = ONCE
    End
  End

  WeaponSet
    Conditions           = None
    Weapon               = PRIMARY   RaikiriPiercingStrike
    Weapon               = SECONDARY KunaiVolleyWeapon
    AutoChooseWeaponInsidePhysicallyDisabled = Yes
  End

  ArmorSet
    Conditions           = None
    Armor                = JoninFlakArmor
    DamageFX             = None
  End

  VisionRange            = 300  ; Sharingan grants expanded vision
  ShroudClearingRange    = 450

  BuildCost              = 1800
  BuildTime              = 20.0
  ExperienceValue        = 200 300 450 600
  IsTrainable            = Yes

  CommandSet             = KonohaKakashiCommandSet

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 800.0
    InitialHealth   = 800.0
  End

  ; --- SHARINGAN PASSIVE: DETECTS STEALTH & EVASION ---
  Behavior = StealthDetectorUpdate ModuleTag_03
    DetectionRate     = 500   ; Checks every 500ms
    DetectionRange    = 350   ; Spots hidden clay mines, Zetsu, and rogue nukenin
    CanDetectWhileGarrisoned  = No
    CanDetectWhileContained   = No
  End

  ; --- AUTO-HEAL PASSIVE (MEDIC FIRST AID) ---
  Behavior = AutoHealBehavior ModuleTag_04
    HealingAmount     = 5
    HealingDelay      = 1000
    StartHealingDelay = 5000
  End

  ; --- ACTIVE JUTSU: KAMUI (DIMENSIONAL WARP DISMISSAL) ---
  Behavior = SpecialPowerCompletionDie ModuleTag_05
    SpecialPowerTemplate = SpecialPower_KakashiKamui
  End

  Behavior = AIUpdateInterface ModuleTag_06
    AutoAcquireEnemiesWhenIdle = Yes
  End

  Locomotor = SET_NORMAL HighSpeedNinjaLocomotor
  CrushableLevel = 2 ; Cannot be crushed by normal vehicles
End
