; -----------------------------------------------------------------------------
; KUMO BUILDER (Lightning Earth Crafter)
; -----------------------------------------------------------------------------
Object KumoLightningBuilder
  SelectPortrait         = SNKumoBuilder_L
  ButtonImage            = SNKumoBuilder
  Side                   = FactionKumo
  EditorSorting          = INFANTRY
  TransportSlotCount     = 1

  ArmorSet
    Conditions           = None
    Armor                = ShinobiClothArmor
  End

  VisionRange            = 150
  ShroudClearingRange    = 250
  BuildCost              = 1000
  BuildTime              = 5.0

  Body = ActiveBody ModuleTag_01
    MaxHealth       = 180.0
    InitialHealth   = 180.0
  End

  Behavior = DozerAIUpdate ModuleTag_02
    RepairHealthPercentPerSecond = 2%
    BoredTime                    = 3000
    BoredRange                   = 150
  End

  Locomotor = SET_NORMAL NinjaLocomotor
  CrushableLevel = 0
End

